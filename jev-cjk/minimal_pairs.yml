# Each case asks one yes/no question of two texts that differ in one place.
# `holds` is the text the answer is yes for, `fails` the one it is no for.

- phenomenon: final_negation
  question:
    en: Does this software support Linux?
    ja: このソフトはLinuxに対応していますか?
    ko: 이 소프트웨어는 Linux를 지원하나요?
  texts:
    en: {holds: "This software supports Linux.", fails: "This software does not support Linux."}
    ja: {holds: "このソフトはLinuxに対応している。", fails: "このソフトはLinuxに対応していない。"}
    ko: {holds: "이 소프트웨어는 Linux를 지원한다.", fails: "이 소프트웨어는 Linux를 지원하지 않는다."}

- phenomenon: final_negation
  question:
    en: Has a second season been confirmed?
    ja: 第2期の制作は決定していますか?
    ko: 2기 제작이 확정되었나요?
  texts:
    en: {holds: "Production of a second season of the anime has been confirmed.", fails: "Production of a second season of the anime has not been confirmed."}
    ja: {holds: "アニメ第2期の制作が決定しました。", fails: "アニメ第2期の制作は決定していません。"}
    ko: {holds: "애니메이션 2기 제작이 확정되었습니다.", fails: "애니메이션 2기 제작은 확정되지 않았습니다."}

- phenomenon: final_negation
  question:
    en: Will the event take place?
    ja: イベントは開催されますか?
    ko: 이벤트는 열리나요?
  texts:
    en: {holds: "The fan event scheduled for this weekend will be held as planned.", fails: "The fan event scheduled for this weekend will not be held."}
    ja: {holds: "今週末に予定していたファンイベントは予定通り開催いたします。", fails: "今週末に予定していたファンイベントは開催いたしません。"}
    ko: {holds: "이번 주말로 예정된 팬 이벤트는 예정대로 개최합니다.", fails: "이번 주말로 예정된 팬 이벤트는 개최하지 않습니다."}

- phenomenon: final_negation
  question:
    en: Can this API be used free of charge?
    ja: このAPIは無料で使えますか?
    ko: 이 API는 무료로 쓸 수 있나요?
  texts:
    en: {holds: "This API can be used for free.", fails: "This API cannot be used for free."}
    ja: {holds: "このAPIは無料で利用できます。", fails: "このAPIは無料では利用できません。"}
    ko: {holds: "이 API는 무료로 이용할 수 있습니다.", fails: "이 API는 무료로는 이용할 수 없습니다."}

- phenomenon: final_negation
  question:
    en: Was the bug fixed in this release?
    ja: このリリースで不具合は修正されましたか?
    ko: 이번 릴리스에서 버그가 수정되었나요?
  texts:
    en: {holds: "The login bug reported last week was fixed in this release.", fails: "The login bug reported last week was not fixed in this release."}
    ja: {holds: "先週報告されたログインの不具合は、今回のリリースで修正された。", fails: "先週報告されたログインの不具合は、今回のリリースでは修正されなかった。"}
    ko: {holds: "지난주에 보고된 로그인 버그는 이번 릴리스에서 수정되었다.", fails: "지난주에 보고된 로그인 버그는 이번 릴리스에서 수정되지 않았다."}

- phenomenon: final_negation
  question:
    en: Does the reviewer recommend the film?
    ja: 筆者はこの映画を勧めていますか?
    ko: 글쓴이는 이 영화를 추천하나요?
  texts:
    en: {holds: "I saw the film on opening day. I would recommend it to people who have not read the original.", fails: "I saw the film on opening day. I would not recommend it to people who have not read the original."}
    ja: {holds: "公開初日に観てきた。原作を読んでいない人にはおすすめできる。", fails: "公開初日に観てきた。原作を読んでいない人にはおすすめできない。"}
    ko: {holds: "개봉 첫날 보고 왔다. 원작을 읽지 않은 사람에게는 추천할 만하다.", fails: "개봉 첫날 보고 왔다. 원작을 읽지 않은 사람에게는 추천하기 어렵다."}

- phenomenon: double_negation
  question:
    en: Is the speaker able to participate?
    ja: 話し手は参加できますか?
    ko: 화자는 참가할 수 있나요?
  texts:
    en: {holds: "It is not that I cannot participate.", fails: "It is not that I can participate."}
    ja: {holds: "参加できないわけではありません。", fails: "参加できるわけではありません。"}
    ko: {holds: "참가할 수 없는 것은 아닙니다.", fails: "참가할 수 있는 것은 아닙니다."}

- phenomenon: double_negation
  question:
    en: Did the speaker end up agreeing?
    ja: 話し手は結局同意しましたか?
    ko: 화자는 결국 동의했나요?
  texts:
    en: {holds: "I could not help but agree with the proposal.", fails: "I could not agree with the proposal."}
    ja: {holds: "その提案には同意せざるを得なかった。", fails: "その提案には同意できなかった。"}
    ko: {holds: "그 제안에는 동의하지 않을 수 없었다.", fails: "그 제안에는 동의할 수 없었다."}

- phenomenon: double_negation
