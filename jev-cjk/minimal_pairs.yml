    ja: {holds: "書類を提出しないわけにはいきません。", fails: "書類は提出しなくてもかまいません。"}
    ko: {holds: "서류를 제출하지 않으면 안 됩니다.", fails: "서류는 제출하지 않아도 됩니다."}

- phenomenon: indirect_refusal
  question:
    en: Did the speaker accept the request?
    ja: 話し手は依頼を引き受けましたか?
    ko: 화자는 의뢰를 받아들였나요?
  texts:
    en: {holds: "Thank you for the offer. We would be glad to take it on.", fails: "Thank you for the offer. I am afraid we will have to pass this time."}
    ja: {holds: "ご依頼ありがとうございます。ぜひお引き受けいたします。", fails: "ご依頼ありがとうございます。今回は見送らせていただきます。"}
    ko: {holds: "의뢰 감사합니다. 기꺼이 맡겠습니다.", fails: "의뢰 감사합니다. 이번에는 어려울 것 같습니다."}

- phenomenon: indirect_refusal
  question:
    en: Did the speaker accept the request?
    ja: 話し手は依頼を引き受けましたか?
    ko: 화자는 의뢰를 받아들였나요?
  texts:
    en: {holds: "Regarding your request, we will proceed as you proposed.", fails: "Regarding your request, that would be rather difficult for us."}
    ja: {holds: "ご依頼の件、ご提案の通り進めさせていただきます。", fails: "ご依頼の件、弊社としてはなかなか難しいかと存じます。"}
